<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   
    <style>

    table{
        font-family: Arial, Helvetica, sans-serif;
        font-weight: bold;
        border: 2px solid black;
        border-collapse: collapse;
        width: 400px;
        height: 100px;


    }

    tr td {
        text-align: center;
        padding: 10px;
        border: 2px solid black;
        background-color: #dbdbdb;



    }
    
    .linha1{
        background-color:#9fecff ;

    }

    .linha2{
        background-color: #077bff;
    }
    .linha3{
    background-color: #077bff;

    }
    .linha4{
        background-color: #9fecff;
    }
   

  



</style>


</head>
<body>
   <table>
    <tr>
        <td colspan="4" class="linha1">A</td>
        <td rowspan="5" class="linha2"> B</td>
    
        
       
    </tr>
        <tr>
            <td rowspan="5" class="linha3">C</td>
             
        </tr>
    
    <tr>
        
        <td>D</td>
        <td>E</td>
        <td>F</td>
    

    </tr>
    <tr>
        <td>G</td>
        <td>H</td>
        <td>I</td>

    </tr>
      
    <tr>
        <td>J</td>
        <td>L</td>
        <td>M</td>
         
         
    </tr>
    <tr>
        <td colspan="4" class="linha4" >N</td>
    </tr>
   
   </table>
    
</body>
</html>
