<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width= , initial-scale=1.0">
    <title>expansão de tabelas</title>

<style>
body{
    font-family:Arial, Helvetica, sans-serif;
}
table{
    border: 1px solid black;
    width: 300px;
    height: 200px;
    border-collapse: collapse;
  

}
tr td {
    border: 1px solid black;
    padding: 10px;
    text-align: center;
   

}



</style>


</head>
<body>

    <h1>Mensagem de celulas</h1>

    <table>
<tr>
    <td colspan="2">A</td>
     <td>B</td>
      <td rowspan="2">  C</td>

</tr>

<tr>
    <td>D</td>
    <td>E</td>
    <TD>F</TD>
 
</tr>
<tr>
    <td colspan="2">G</td>
    <td>H</td>
    <td>i</td>


  
</tr>




</table>


    
</body>
</html>
