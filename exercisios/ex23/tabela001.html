<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabela</title>

<style>
body{
    font-family: Arial, Helvetica, sans-serif;
}

table{
    border-collapse: collapse;
    width: 400px;
    height: 300px;
    border: 3px solid #000000e7;
}

td{
    border: 1px solid black;
    padding: 8px;
    font-weight: bold;
    text-align: left ; /*alinhamento horizontal*/
    vertical-align: middle;  /*alinhamento vertical */

}

tr.linha{
    background-color: #ff8585;
    color: aliceblue;
    
}


td#B4{
    background-color: #f75e5e;
    color: rgb(0, 0, 0);
   
    
}
td#C5{

    background-color: #6a6ace;
    color: rgb(0, 0, 0);
}
td#A5{
    background-color: #85fab2;
    color: #000000;
   

}

</style>



</head>
<body>
    <h1>minha primeira tabela</h1>
    
<table>
    <tr class="linha">
        <td>Coluna 1</td>
        <td>Coluna 2</td>
        <td>Coluna 3</td>
    </tr>
    
    <tr>
        <td>A1</td>
        <td>B1</td>
        <td>C1</td>   
    </tr>

    <tr>
        <td>A2</td>
        <td>B2</td>
        <td>C2</td>
    </tr>

    <tr>
        <td>A3</td>
        <td>B3</td>
        <td>C3</td>
    </tr>

    <tr>
        <td>A4</td>
        <td id="B4">B4</td>
        <td>C4</td>
    </tr>

    <tr>
        <td id="A5">A5</td>
        <td>B5</td>
        <td id="C5">C5</td>
    </tr>

</table>





</body>
</html>
