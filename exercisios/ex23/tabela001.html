<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabela</title>

<style>
body{
    font-family: Arial, Helvetica, sans-serif;
}

table{
    border-collapse: collapse;
    width: 400px;
    height: 400px;
    border: 5px solid #000000;
}

td{
    border: 1px solid black;
    padding: 8px;
    font-weight: bold;
    text-align: center ;/*alinhamento horizontal*/
    vertical-align: middle; /*alinhamento vertical */

}

tr.linha{
    background-color: #ff8585;
    color: aliceblue;
}


td#b3{
    background-color: #504e4a;
    color: aliceblue;
    text-align: right;
    

}
td#c6{

    background-color: #6a6ace;
    color: white;
}
td#b5{
    background-color: #85fab2;
    color: #000000;
    text-align: right;

}
</style>



</head>
<body>
    <h1>minha primeira tabela</h1>
    
<table>

    <td>coluna 3</td>

   </tr>
   
   <tr>

    </tr>

    </tr>
   
    <tr>

        <td>C3 </td>
      
    </tr>
   
    <tr>
        <td>A4 </td>

        <td>C4 </td>

    </tr>

    <tr>
        <td> A5</td>

    <tr>

    </tr>





</table>





</body>
</html>
