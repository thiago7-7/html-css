<head>

    <title>alinhamento vertical</title>

<style>
   
    #container {
         
         background-color: blueviolet;
         background-image: url('imagens/target001.png');
         background-size: 100% 100%;
         position: relative;

         padding: 10px;
       


    }
    #conteudo {
        position: absolute;
        background-image: url('imagens/target001.png') ;

        height: 200px;

        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
       
    

    }

</head>

    <article id="conteudo"></article>
