<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    
    <style>

       
       div.conteiner{
            background-color:#ffd994;
           
            display: flex;
            
            flex-flow: row nowrap;
          
         
            
        

        }
        div#item {
            background-color: #57bcff;
           border: solid 1px black;
            text-align: center;
            flex-basis: 150px;
        
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div id="item">A</div>
        <div id="item">Outro conteudo</div>
        <div id="item">C</div>
        <div id="item">conteudo um pouco maior</div>
        <div id="item">E</div>
        <div id="item">conteudo maior ainda, que vai ocupar mais espaço </div>
        <div id="item">G</div>
    </div>
    
</body>
</html>
