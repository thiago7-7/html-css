<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    
    <style>

       
       div.conteiner{
            background-color:rgb(255, 178, 127);
            display: flex;
            flex-flow: row nowrap;
        
           
     
        }
        
          div#item {
            background-color: #a2e5ff;
            border: solid 1px black;
            text-align: center;
           
          
         
        }
           div.cxA {
            flex: 0 2 200px ;
        }

        div.cxB {
            flex: 1 0 200px ;
        }

        div.cxC {
            flex: 1 4 200px ;
     
        }
     
    </style>
</head>
<body>
    <div class="conteiner">
        <div id="item" class="cxA">A</div>
        
        <div id="item" class="cxB">B</div>
       
        <div id="item" class="cxC">C</div>
       
    </div>
    
</body>
</html>
