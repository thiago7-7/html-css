<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    
    <style>

       
       div.conteiner{
            background-color:rgb(248, 188, 167);
            height: 400px;
            justify-content: space-evenly;
            align-items: flex-start;
            display: flex;
            flex-flow: row wrap;
          
           
        }
        
        div.item {
            background-color: rgb(67, 133, 255);
            border: solid 1px black;
            padding: 20px;
            
          
      
        }

        div#i1{
          align-self: auto;
        }

            div#i2{
           align-self: flex-start;
        }

            div#i3{
         align-self: flex-end;
        }

            div#i4{
            align-self: center;
        }

    
            div#i5{
           align-self: stretch;
        }

       
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="i1" >A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
        <div class="item" id="i4">D</div>
        <div class="item" id="i5">E</div>
       
       
    </div>
    
</body>
</html>
