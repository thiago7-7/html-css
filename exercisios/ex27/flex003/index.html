<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    
    <style>

       
       div.conteiner{
            background-color:aquamarine;
            
            display: flex;
            flex-flow: row wrap;
        

        }
        div#item {
            background-color: rgb(15, 118, 187);
            border: solid 2px black;
            text-align: center;
            flex:auto;
           
        
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div id="item"> Exemplo de bloco A</div>
        <div id="item"> Exemplo de bloco B</div>
        <div id="item"> Exemplo de bloco C</div>
        <div id="item"> Exemplo de bloco D</div>
        <div id="item"> Exemplo de bloco E</div>
        <div id="item"> Exemplo de bloco F</div>
        <div id="item"> Exemplo de bloco G</div>
    </div>
    
</body>
</html>
