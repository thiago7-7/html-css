<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
</head>
    <style>
        *{
            padding: 0px;
            margin: 0px;
            font-family: Arial, Helvetica, sans-serif;
        }
        body{
            background-color: burlywood;
        }
        main {
            background-color: lightgreen;
            height: 100vh;
            width: 100vw;
            justify-content: center;
            align-items: center;
            flex-flow: row nowrap;
            display: flex;
        }
        section{
            background-color: rgb(127, 236, 255);
            width: 200px;
            height:200px;
    
          
        }

        h1{
            padding: 10px;
            font-size: 1.5em;
       
        }
    </style>

<body>
    <main>
        <section>
            <h1>Tela de login</h1>
        </section>
    </main>
</body>
</html>
