<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
</head>
<body>
    <h1>teste formulario</h1>
    
    <form action="cadastro.php" method="get">

        <p>
            <label for="inome">Nome</label>
            <input type="nome" id="inome" required maxlength="30" placeholder="nome completo"> 
        </p>

        <p>
            <label for="imedia">Média</label>
            <input type="number" name="media" id="imedia" min="0" max="10" step="0.5" placeholder="0 a 10" value="5">
        </p>

        <p>
            <label for="imes">periodo letivo</label>
            <input type="month" name="mes" id="imes" value="2022-08">
        </p>

        <p>
            <label for="idia">Dia da prova</label>
            <input type="date" name="dia" id="idia" value="2022-08-12">
        </p>

        <p>
            <label for="ihora">Horario da prova</label>
            <input type="time" name="Hora" id="ihora" value="00:00" required>
        </p>



        <p>
            <input type="submit" value="enviar">
            <input type="reset" value="limpar">
            
        </p>




    </form>

</body>
</html>
