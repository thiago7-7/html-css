<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>



</head>
<body>
    
    <form action="cadastro.php" method="post" autocomplete="on">

        <p><label for="iusu">Usuario:</label>
            
             <input type="text" name="usu" id="iusu" minlength="5" required maxlength="20" size="10" autocomplete="username" placeholder="nome de usuario" >
            </p>

        <p><label for="isen">Senha:</label> 
            
            <input type="password" name="sen" id="isen" placeholder="minimo 8 letras" required minlength="8" maxlength="20" autocomplete="current-password" size="10"></p>
        
      
       
       
        <p>  
           <input type="submit" value="enviar">
           <input type="reset" value="limpar">
       </p>




    </form>



</body>
</html>
