<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>

</head>
<body>
    <h1>Exemplo de formulario</h1>


    <form action="cadastro.php" method="post">

    <p><label for="icor">color:</label><input type="color" name="cor" id="icor" value="#ff0"></p>

    <p>
       <label for="inivel">Nivel de sastifação:</label> <input type="range" name="nivel" id="inivel" min="1" max="5" value="2">
    </p>

    <p>
        <label for="ifoto">Foto do perfil:<input type="file" name="foto" id="ifoto"></label>
    </p>

    <p>
        <input type="submit" value="enviar">
        <input type="reset" value="limpar">
    </p>

</form>

</body>
</html>
