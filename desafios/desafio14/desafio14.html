<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabela</title>

    <style>

        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            border: 1px solid black;
            border-collapse: collapse;
            width: 400px;
            height: 500px;
        }
        thead th  {
            
            border: 1px solid black;
            background-color: rgb(163, 163, 163);
            color: white;
           
        }
         tbody, th{
            border: 1px solid black;
           
           
            
        }

        tr, td {
            border: 1px solid black;
            padding: 4px;
            font-weight: bold;
            color: rgb(22, 22, 22);
           
        } 
        
        .direita{
            text-align: left;
            padding: 4px;
            color: white;
             padding-left: 6px;
        }
        
        #Q5{
            color: white;
            background-color: rgb(163, 163, 163);
           
        }

           


    </style>


  
    


</head>
<body>
    
        <table>

            <thead >
                
                <th rowspan="2" scope="col">Área</th>
                <th rowspan="3" scope="col">Disciplinas</th>
                 <th colspan="2" scope="colgroup">Notas</th>
                 <th rowspan="2" scope="col">Média</th>
                
                 <tr>
                    <th scope="col">Nota 1</th>
                    <th scope="col">Nota 2</th>
                   </tr>
                    
                
            </thead>
            
            <tbody>
            
            <tr>
    
                <th rowspan="4" scope="rowgroup">Exatas</th>
                <td>Matemática</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
                
            </tr>

            <tr>
                <td>Física</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
                
            </tr>

            <tr>
                <td>Química</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
               
            </tr>

            <tr>
                <td>Biologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
                
            </tr>
            
               <thead>
                    <th colspan="4" scope="row" class="direita">Média de Exatas</th>
                    <td id="Q5">0.0</td>
                </thead>
        
             

            <tr>
                <th rowspan="2" scope="rowgroup">Humanas</th>
                <td>História</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <td>Geografia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

        

            </tbody>

         
            <thead>
                <th colspan="4"scope="row" class="direita">Média Humanas</th>
                <td id="Q5">0.0</td>
            </thead>





        </table>



</body>
</html>
