<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabelas</title>
<style>

    table{
        font-family: Arial, Helvetica, sans-serif;
        font-weight: bold;
        border: 2px solid black;
        border-collapse: collapse;
        width: 400px;
        height: 100px;
    }

    tr td {
        text-align: center;
        padding: 10px;
        border: 2px solid black;
        background-color: #dbdbdb;
    }
    
    #linha1{
        background-color:#9fecff ;

    }

    #linha2{
        background-color: #077bff;
    }
 
</style>


</head>
<body>
   <table>
 
    <tr>
        <td colspan="4" id="linha1">A</td>
        <td rowspan="5" id="linha2">B</td>
       
    </tr>

    <tr>
        <td rowspan="5" id="linha1">C</td>
        
    </tr>
   
    <tr>
        <td>D</td>
        <td>E</td>
        <td>F</td>
    </tr>

        <tr>
            <td>G</td>
            <td>H</td>
            <td>I</td>
        </tr>

        <tr>
            <td>J</td>
            <td>K</td>
            <td>L</td>
        </tr>
        
        <tr>
        <td colspan="4" id="linha2">N</td>
        </tr>




   </table>
    

</body>
</html>
